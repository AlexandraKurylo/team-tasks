<header class="header">
    <a routerLink="/team" class="logo">Team Tasks</a>

    <nav class="nav">
        <a routerLink="/team" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">
            Team
        </a>
    </nav>

    <span class="badge">{{ notificationsCount() }}</span>

    <button (click)="showTimer.set(!showTimer())">Toggle timer</button>
    @if (showTimer()) {
    <app-session-timer />
    }
</header>

<main class="main">
    <router-outlet />
</main>

<app-toast />
