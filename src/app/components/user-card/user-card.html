<div class="card"
    [class]="{ active: user().isActive, inactive: !user().isActive }">
    <div class="avatar">{{ user().name | initials }}</div>

    <div class="info">
        <a class="name" [routerLink]="['/team', user().id]">{{ user().name
            }}</a>
        <span class="meta">
            {{ user().role | titlecase }} · joined {{ user().joinedAt | date:
            'dd.MM.yyyy' }}
        </span>
        @if (showEmail()) {
        <span class="email">{{ user().email | truncate: 18 }}</span>
        }
    </div>

    <span class="workload" [class.overloaded]="user().workload > 1">
        {{ user().workload | percent }}
    </span>

    <div class="actions">
        <button (click)="toggleActive.emit(user().id)">
            {{ user().isActive ? 'Deactivate' : 'Activate' }}
        </button>
        <button (click)="remove.emit(user().id)">Remove</button>
    </div>
</div>
