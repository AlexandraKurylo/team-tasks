<div class="stats">
    <div class="stat">
        <span class="value">{{ total() }}</span>
        <span class="label">Total</span>
    </div>
    <div class="stat">
        <span class="value">{{ active() }}</span>
        <span class="label">Active</span>
    </div>
    <div class="stat" [class.danger]="overloaded() > 0">
        <span class="value">{{ overloaded() }}</span>
        <span class="label">Overloaded</span>
    </div>
    <div class="stat">
        <span class="value">{{ averageWorkload() | percent }}</span>
        <span class="label">Avg workload</span>
    </div>
</div>
